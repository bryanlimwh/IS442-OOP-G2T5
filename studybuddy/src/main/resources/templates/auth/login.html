<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Study Buddy Matcher</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Study Buddy Matcher System</h1>
    </header>

    <main class="login-card">
        <h2>Log in</h2>

        <!-- Spring Security redirects to /login?error after a failed attempt, and /login?logout after logging out -->
        <p class="message error" th:if="${param.error}">Incorrect email or password, or the account is deactivated.</p>
        <p class="message info" th:if="${param.logout}">You have been logged out.</p>

        <!-- th:action adds the hidden CSRF token that Spring Security requires on every POST -->
        <form class="login-form" th:action="@{/login}" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
