spring.application.name=studybuddy

# Database location: in-memory DB named "studydb"
# Use 'jdbc:h2:file:./data/studydb' instead to save to disk
spring.datasource.url=jdbc:h2:mem:studybuddydb

# JDBC driver class used to talk to H2
spring.datasource.driver-class-name=org.h2.Driver

# Default H2 login credentials
spring.datasource.username=sa
spring.datasource.password=

# Enable the H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate creates/updates tables automatically from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Print generated SQL to the console (useful for learning/debugging)
spring.jpa.show-sql=true

# Login password given to every seeded demo account (dev only)
studybuddy.seed.password=password123

# Starting settings for the matching engine. Copied into the database at
# startup; an admin can change them at /admin/matching while the app runs.
# Weights are relative (each criterion's share = its weight / total of all
# weights), and a weight of 0 switches that criterion off.
# Strategy: BALANCED, AVAILABILITY_FIRST or COURSE_FIRST.
studybuddy.matching.defaults.strategy=BALANCED
studybuddy.matching.defaults.course-weight=20
studybuddy.matching.defaults.availability-weight=20
studybuddy.matching.defaults.study-mode-weight=20
studybuddy.matching.defaults.study-goal-weight=20
studybuddy.matching.defaults.group-size-weight=20
# Shared free time (in minutes) that counts as full marks for availability.
studybuddy.matching.defaults.target-session-minutes=120

# Score (0 to 1) for study mode or group size when one student picked a
# specific option and the other picked EITHER: compatible, but below an exact
# match. Not on the admin page; it tunes how the criteria are scored.
studybuddy.matching.either-preference-score=0.8

# Weekly time slots on the create / edit study group form: how many slots a
# group may have, and the times the From / To dropdowns offer (24-hour,
# from the earliest to the latest time in steps of this many minutes).
studybuddy.groups.max-availability-slots=3
studybuddy.groups.earliest-slot-time=08:00
studybuddy.groups.latest-slot-time=23:00
studybuddy.groups.slot-step-minutes=15
# The Browse page's order until a student picks another "Sort by" option.
# NEWEST, NAME, MOST_PLACES or COURSE. Full groups are always listed last.
studybuddy.groups.default-sort=NEWEST
